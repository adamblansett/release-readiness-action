name: 'Release Readiness Action'
description: 'Evaluate whether a software project satisfies release-readiness requirements before release or deployment.'
author: 'Adam Blansett'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  config-path:
    description: 'Path to configuration file (.release-readiness.yml, .release-readiness.json)'
    required: false
  working-directory:
    description: 'Root directory of the project to evaluate'
    required: false
    default: '.'
  fail-on:
    description: 'Minimum severity level to fail the action: error, warning, or never (default: error)'
    required: false
  fail-on-secrets:
    description: 'Whether any detected secret causes immediate failure regardless of fail-on (default: true)'
    required: false
  execute-scripts:
    description: 'Explicit opt-in to execute configured validation scripts (e.g. test, lint, build) (default: false)'
    required: false
  scripts-to-run:
    description: 'Comma-separated list of scripts to execute when execute-scripts is enabled'
    required: false
  check-secrets:
    description: 'Enable local repository secret scanning (default: true)'
    required: false
  check-uncommitted:
    description: 'Check for dirty git state or uncommitted changes (default: false)'
    required: false
  check-tag-version:
    description: 'Verify git tag matches package version (e.g. in release tag workflows) (default: false)'
    required: false
  audit-dependencies:
    description: 'Run npm audit dependency security check (requires network) (default: false)'
    required: false
  output-format:
    description: 'Report output format: all, summary, markdown, json, or console (default: all)'
    required: false
  create-summary:
    description: 'Emit GFM report into GitHub Step Summary (default: true)'
    required: false
  annotate-github:
    description: 'Emit inline GitHub Action PR annotations for errors and warnings (default: true)'
    required: false

outputs:
  passed:
    description: 'Whether all release readiness criteria passed (true/false)'
  findings-count:
    description: 'Total number of findings identified'
  errors-count:
    description: 'Count of error-level findings'
  warnings-count:
    description: 'Count of warning-level findings'
  report-json:
    description: 'Structured JSON evaluation report'
  report-markdown:
    description: 'Markdown summary of the evaluation report'

runs:
  using: 'node24'
  main: 'dist/action.js'
