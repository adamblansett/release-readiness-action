name: CI & Release Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run format check
        run: npm run format:check

      - name: Run unit and integration tests
        run: npm run test

      - name: Build action and bundle
        run: npm run build

      - name: Run Release Readiness Action (self-test)
        uses: ./
        with:
          fail-on: error
          check-secrets: true
          output-format: all
